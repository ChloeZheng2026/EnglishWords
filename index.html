  --belly:#CFF3DC; --shadow:0 4px 0 #0C161D; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--f-zh);font-weight:400;font-size:22px;letter-spacing:.5px;flex:1;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:16px}

main{padding-block:18px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;font-weight:800;font-size:13px;color:var(--muted)}
.tab b{font-size:22px;line-height:1}
.tab[aria-current="page"]{background:var(--leaf-soft);color:var(--ink)}

h2{font-family:var(--f-display);font-size:24px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:16px;font-weight:800;background:var(--surface2);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.go{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#3A2A00;box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--coral) 60%,#000)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:14px;border-radius:12px}

/* pet */
.petstage{position:relative;text-align:center;background:linear-gradient(var(--sky-soft) 0 62%, var(--leaf-soft) 62%);border-radius:22px;border:2px solid var(--line);padding:18px 12px 10px;overflow:hidden}
.petstage svg{width:min(240px,70%);height:auto;display:block;margin:0 auto}
.bubble{display:inline-block;max-width:90%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 14px;font-family:var(--f-zh);font-size:18px;position:relative;margin-bottom:6px;min-height:44px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.petname{font-family:var(--f-zh);font-size:22px;background:transparent;border:0;border-bottom:2px dashed var(--line);text-align:center;color:var(--ink);width:7em}
.meter{height:14px;border-radius:99px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s}
.mlabel{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:4px}
.mlabel span{color:var(--muted);font-variant-numeric:tabular-nums}
.p-body{fill:var(--leaf)} .p-belly{fill:var(--belly)} .p-eye{fill:#1F3047} .p-shine{fill:#fff} .p-cheek{fill:var(--coral);opacity:.55}
.p-mouth{fill:none;stroke:#1F3047;stroke-width:4;stroke-linecap:round} .p-leaf{fill:var(--sun)} .p-egg{fill:#FFF6DC;stroke:#E7C774;stroke-width:3}
.p-spot{fill:var(--sun);opacity:.7} .p-crack{fill:none;stroke:#B98E28;stroke-width:3;stroke-linejoin:round} .p-crown{fill:var(--sun);stroke:#C9951A;stroke-width:2}
.p-scarf{fill:var(--coral)} .p-shadow{fill:#000;opacity:.12}
.bob{animation:bob 2.4s ease-in-out infinite;transform-origin:100px 190px}
.chomp{animation:chomp .5s ease 2} .wiggle{animation:wig .6s ease}
@keyframes bob{50%{transform:translateY(-6px) scaleY(1.02)}}
@keyframes chomp{50%{transform:scale(1.08,.92)}}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}

/* game menu */
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.game{position:relative;text-align:left;border-radius:22px;padding:16px;min-height:150px;border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;transition:transform .1s}
.game:hover{transform:translateY(-2px)} .game:active{transform:translateY(2px)}
.game .ico{font-size:34px;line-height:1}
.game h3{margin:6px 0 0;font-family:var(--f-zh);font-size:21px;font-weight:400}
.game p{margin:0;font-size:13px;color:var(--muted)}
.game .tag{margin-top:auto;font-size:12px;font-weight:800;align-self:flex-start;padding:2px 8px;border-radius:99px;background:var(--surface)}
.g1{background:var(--sun-soft)} .g2{background:var(--sky-soft)} .g3{background:var(--coral-soft)} .g4{background:var(--leaf-soft)}
.deckpick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select{font:inherit;font-weight:700;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}

/* in-game */
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ghead h2{flex:1;margin:0;font-family:var(--f-zh);font-weight:400;font-size:22px;min-width:0}
.prog{height:10px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--sun);transition:width .3s}
.prompt{text-align:center;padding:22px 14px}
.prompt .zh{font-family:var(--f-zh);font-size:clamp(26px,7vw,38px);line-height:1.3}
.prompt .en{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7vw,40px);line-height:1.2;overflow-wrap:anywhere}
.prompt .en.long{font-size:clamp(20px,5vw,28px)}
.hint{color:var(--muted);font-size:14px;margin-top:6px}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:560px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{min-height:84px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);padding:8px;display:grid;place-items:center;text-align:center;overflow-wrap:anywhere;transition:transform .15s, opacity .3s, background .2s}
.tile.en{font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--sky)}
.tile.zh{font-family:var(--f-zh);font-size:22px}
.tile.sel{background:var(--sun-soft);border-color:var(--sun);transform:translateY(-3px)}
.tile.ok{background:var(--leaf-soft);border-color:var(--leaf);transform:scale(.6);opacity:0;pointer-events:none}
.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.slotline{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:62px;padding:12px;border-radius:18px;border:2px dashed var(--line);background:var(--surface2)}
.wchip{padding:9px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--f-display);font-weight:700;font-size:20px}
.wchip.used{visibility:hidden}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 4px}
.slot{width:42px;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px;border-bottom-width:5px}
.slot.gap{width:14px;border:0;background:none}
.slot.filled{border-color:var(--sky);color:var(--sky)}
.slot.right{border-color:var(--leaf);color:var(--leaf)}
.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.letter{width:48px;height:52px;border-radius:14px;background:var(--sun);color:#3A2A00;font-family:var(--f-display);font-weight:800;font-size:26px;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.letter:active{transform:translateY(3px);box-shadow:none}
.letter.used{visibility:hidden}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{padding:16px 10px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);font-family:var(--f-zh);font-size:22px;min-height:76px;overflow-wrap:anywhere}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf)}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral)}
.opts.long .opt{font-size:18px;grid-column:span 2;min-height:0}

.result{text-align:center}
.result .big{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;margin:8px 0}
.float{position:fixed;z-index:20;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--leaf);animation:up 1s ease forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* decks */
.deck{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.deck.on{border-color:var(--leaf);background:var(--leaf-soft)}
.deck .nm{flex:1;min-width:0;font-weight:800}
.deck .nm small{display:block;color:var(--muted);font-weight:600}
.items{max-height:320px;overflow:auto;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{font-family:var(--f-display);font-weight:700;display:block;overflow-wrap:anywhere}
.item .t span{color:var(--muted);font-size:14px}
textarea,input[type=text],input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:140px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,"PingFang SC",monospace;font-size:14px}
.help{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:14px;padding:10px 12px}
.help code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface);padding:1px 5px;border-radius:6px}
label.lb{font-weight:800;font-size:14px;display:block;margin-bottom:6px}
.empty{text-align:center;color:var(--muted);padding:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2: daily flow */
.tabs .wrap{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.center{justify-content:center;text-align:center}
.trail{display:flex;flex-direction:column}
.st{display:flex;gap:12px;align-items:center;position:relative;padding:7px 0}
.st::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:4px;background:var(--line);border-radius:2px}
.st:first-child::before{top:50%} .st:last-child::before{bottom:50%}
.st .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);font-size:19px;flex:none;position:relative;z-index:1}
.st .nm{flex:1;min-width:0;font-weight:800}
.st .nm small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.st.done .dot{background:var(--leaf);border-color:var(--leaf)}
.st.cur .dot{background:var(--sun);border-color:var(--sun);transform:scale(1.12)}
.st.skip{opacity:.5}
.wordchips{display:flex;flex-wrap:wrap;gap:6px}
.wc{padding:4px 10px;border-radius:12px;font-family:var(--f-display);font-weight:700;background:var(--surface2);border:2px solid var(--line)}
.wc.new{border-color:var(--sun);background:var(--sun-soft)}
.wc.rev{border-color:var(--sky);background:var(--sky-soft)}
.wc.miss{border-color:var(--coral);background:var(--coral-soft)}
.secl{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:4px 0 6px}
.speaker{width:92px;height:92px;border-radius:50%;background:var(--sky);color:#fff;font-size:38px;box-shadow:0 5px 0 color-mix(in srgb,var(--sky) 55%,#000);margin:0 auto}
.speaker:active{transform:translateY(4px);box-shadow:none}
.linkbtn{color:var(--sky);font-weight:800;font-size:14px;text-decoration:underline;margin-top:8px}
.reveal{font-family:var(--f-display);font-weight:700;font-size:28px;margin-top:8px}
.opt.enopt{font-family:var(--f-display);font-weight:700;font-size:22px}
.sent{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,5.4vw,28px);line-height:1.6}
.sent mark{background:var(--sun-soft);color:inherit;border-radius:6px;padding:0 4px}
.blank{display:inline-block;min-width:76px;padding:0 10px;margin:2px 2px;border-radius:10px;background:var(--sky-soft);border:0;border-bottom:3px solid var(--sky);font-family:var(--f-display);font-weight:700;font-size:inherit;line-height:1.5;color:var(--muted)}
.blank.filled{color:var(--ink)}
.blank.sel{outline:3px solid var(--sun)}
.blank.right{background:var(--leaf-soft);border-color:var(--leaf);color:var(--ink)}
.blank.wrongb{background:var(--coral-soft);border-color:var(--coral)}
.passage{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,4.6vw,23px);line-height:2.1}
.rdots{display:flex;justify-content:center;gap:12px;margin:14px 0}
.rdots span{width:22px;height:22px;border-radius:50%;border:3px solid var(--leaf)}
.rdots span.on{background:var(--leaf)}
.mini{display:flex;gap:4px;margin-bottom:10px}
.mini i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.mini i.d{background:var(--leaf)} .mini i.c{background:var(--sun)}
.ptitle{font-family:var(--f-zh);font-size:26px}
.slot.reveal-ans{border-color:var(--coral);color:var(--coral)}
details summary{cursor:pointer;font-weight:800;color:var(--sky)}
.streak{color:var(--coral)}
.setrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.item .tag2{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.tag2.m{background:var(--leaf-soft)} .tag2.r{background:var(--sky-soft)}
.item .t em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.petstage{background:var(--surface);padding:14px 10px 10px}
.petstage svg.scene{width:100%;max-width:520px;border-radius:16px}
.r-wall{fill:var(--sky-soft)} .r-floor{fill:var(--leaf-soft)} .r-line{stroke:var(--line);stroke-width:3}
.bubble.enb{font-family:var(--f-display);font-weight:700}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:14px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-bottom:6px}
.sitem{background:var(--surface2);border:2px solid transparent;border-radius:16px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.sitem.own{border-color:var(--line)} .sitem.dim{opacity:.6}
.sitem .ic{font-size:30px;line-height:1.1}
.sitem b{font-size:14px}
.minipet{width:84px;height:auto}
.tab[hidden]{display:none}
.minipet.locked{filter:brightness(0);opacity:.18}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding:4px 2px}
.cb{max-width:85%;display:flex;flex-direction:column;gap:2px;align-self:flex-start}
.cb.k{align-self:flex-end;align-items:flex-end}
.cbw{font-size:12px;font-weight:800;color:var(--muted)}
.cbt{background:var(--surface2);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-family:var(--f-display);font-weight:700;font-size:18px;text-align:left;overflow-wrap:anywhere}
.cb.k .cbt{background:var(--sky-soft);border-color:var(--sky);border-radius:16px 16px 4px 16px}
.cb small{color:var(--muted);font-size:13px}
.cb small.fix{color:var(--leaf)}
.kidturn{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.zhline{font-family:var(--f-zh);font-size:22px;text-align:center;margin-bottom:10px}
.wchip.sug{font-size:16px;padding:6px 10px;background:var(--sun-soft);border-color:var(--sun)}
.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grp{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:16px;background:var(--surface2);text-align:center;min-width:0}
.grp b{font-size:12px;white-space:nowrap}
.gi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);font-size:17px}
.grp.done .gi{background:var(--leaf);border-color:var(--leaf);color:#fff} .grp.cur{background:var(--sun-soft)} .grp.cur .gi{border-color:var(--sun)}
.gd{display:flex;gap:3px} .gd i{width:7px;height:7px;border-radius:50%;background:var(--line)} .gd i.d{background:var(--leaf)} .gd i.c{background:var(--sun)}
.qa{display:flex;gap:10px;align-items:center}
.qa>div{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.qa small{color:var(--muted);font-size:14px}
.qtag{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sky-soft);font-weight:800;flex:none}
.qtag.a{background:var(--sun-soft)}
.cbt.k{background:var(--sky-soft);border-color:var(--sky)}
.swatch{display:inline-block;width:44px;height:44px;border-radius:12px;border:3px solid var(--line);flex:none;margin:0 auto 6px}
.apples{font-size:28px;letter-spacing:2px;margin-bottom:6px}
.mic{width:100%;padding:16px;border-radius:18px;background:var(--sky);color:#fff;font-size:19px;font-weight:800;box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 55%,#000)}
.mic.on,#fMic.on{background:var(--coral);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.btn.pulse{animation:pulse .6s 4;box-shadow:0 0 0 4px #ffd54a}
.sayfb{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:16px;line-height:1.7}
.sayfb.ok{background:var(--leaf-soft)} .sayfb.no{background:var(--coral-soft)}
.sayfb b{font-family:var(--f-display);font-size:18px}
#sayIn,#fIn{font-size:17px;flex:1;min-width:0}
#sayForm .btn,#fForm .btn{white-space:nowrap;flex:none}
details.fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}

<script>
/* 字体异步加载：国内打不开谷歌字体时直接用系统字体，不卡页面 */
try{const fl=document.createElement('link');fl.rel='stylesheet';fl.href='https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap';document.head.appendChild(fl)}catch(e){}
/* ================= data ================= */
const SAMPLE=[
 {id:'animals',name:'动物朋友',items:[
  ['cat','猫',"The cat says meow.",'小猫喵喵叫。'],['dog','狗',"The dog says woof.",'小狗汪汪叫。'],
  ['rabbit','兔子',"The rabbit has long ears.",'兔子有长长的耳朵。'],['panda','熊猫',"The panda eats bamboo.",'熊猫吃竹子。'],
  ['tiger','老虎',"The tiger has black stripes.",'老虎身上有黑色的条纹。'],['monkey','猴子',"The monkey can climb trees.",'猴子会爬树。'],
  ['elephant','大象',"The elephant has a long nose.",'大象有一个长长的鼻子。'],['bird','鸟',"The bird can fly in the sky.",'小鸟能在天上飞。'],
  ['fish','鱼',"The fish swims in the water.",'鱼在水里游。'],['duck','鸭子',"The duck says quack.",'鸭子嘎嘎叫。']]},
 {id:'food',name:'好吃的',items:[
  ['apple','苹果',"An apple is red and round.",'苹果又红又圆。'],['banana','香蕉',"The monkey eats a yellow banana.",'猴子吃一根黄色的香蕉。'],
  ['orange','橙子',"I peel an orange.",'我剥一个橙子。'],['grape','葡萄',"Grapes are small and purple.",'葡萄又小又紫。'],
  ['watermelon','西瓜',"A watermelon is big and green.",'西瓜又大又绿。'],['milk','牛奶',"The cow gives us milk.",'奶牛给我们牛奶。'],
  ['bread','面包',"I put butter on my bread.",'我在面包上抹黄油。'],['egg','鸡蛋',"The hen lays an egg.",'母鸡下了一个蛋。'],
  ['rice','米饭',"I eat rice with chopsticks.",'我用筷子吃米饭。'],['juice','果汁',"I drink a glass of juice.",'我喝一杯果汁。']]},
 {id:'school',name:'我的学校',items:[
  ['book','书',"I read a book.",'我读一本书。'],['pencil','铅笔',"I write with a pencil.",'我用铅笔写字。'],
  ['ruler','尺子',"I draw a line with a ruler.",'我用尺子画一条线。'],['teacher','老师',"Our teacher teaches us English.",'我们的老师教我们英语。'],
  ['student','学生',"I am a student at school.",'我是学校里的一名学生。'],['desk','课桌',"I sit at my desk in class.",'上课时我坐在我的课桌前。'],
  ['school bag','书包',"I carry my school bag to school.",'我背着书包去上学。'],['classroom','教室',"We have lessons in the classroom.",'我们在教室里上课。'],
  ['eraser','橡皮',"I use an eraser to fix mistakes.",'我用橡皮改错。'],['friend','朋友',"Tom is my best friend.",'汤姆是我最好的朋友。']]}];
const INTERVALS=[1,2,4,7,15]; // 复习间隔（天），连续答对 5 次复习就算掌握
const STEPS=[
 {key:'match',ico:'🧩',name:'单词配对',desc:'把英文和中文配成一对。点错的词会单独再练，最后全部再刷一遍。'},
 {key:'venzh',ico:'👀',name:'看英文选中文',desc:'看英文单词，选出正确的中文意思。'},
 {key:'vzhen',ico:'🔍',name:'看中文选英文',desc:'看中文，选出正确的英文单词。'},
 {key:'enzh',ico:'👂',name:'听英文选中文',desc:'听英文读音，选出正确的中文意思。'},
 {key:'zhen',ico:'🗣️',name:'听中文选英文',desc:'听中文，选出正确的英文单词。'},
 {key:'spell',ico:'✏️',name:'听音拼写',desc:'听读音，用字母把单词拼出来。拼错的词要连续拼对 5 次才过关。'},
 {key:'fill',ico:'🧱',name:'句子补全',desc:'看句子，选一个单词填进空格。接好 AI 后，句子每天都是新编的。',ex:true},
 {key:'read',ico:'📢',name:'跟读三遍',desc:'每个句子先听，再大声跟读，一共读 3 遍。',ex:true},
 {key:'build',ico:'🔤',name:'看中文拼句子',desc:'看中文，把打乱的英文单词排成句子。',ex:true},
 {key:'cloze',ico:'📖',name:'完形填空',desc:'把今天的单词填进小短文，全部填对才过关。接好 AI 后，每天是一篇新编的小故事。',ex:true},
 {key:'talk',ico:'💬',name:'每日对话',desc:'用嘴说：先考之前学过的问句，再学 3 个新问句，每句都要会回答、会提问。'}];
const GROUPS=[['认单词','🧩',[0,1,2]],['听一听','👂',[3,4]],['拼一拼','✏️',[5]],['用句子','📖',[6,7,8,9]],['说一说','💬',[10]]];

const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date());
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return fmt(new Date(y,m-1,d+n))}
const CJK=/[㐀-鿿豈-﫿]/;
const wid=(deckId,en)=>deckId+'|'+en.trim().toLowerCase();
function mkItem(deckId,en,zh,ex,exZh){return {id:wid(deckId,en),en:en.trim(),zh:zh.trim(),ex:(ex||'').trim(),exZh:(exZh||'').trim()}}
function mkDeck(id,name,rows){return {id,name,items:rows.map(r=>mkItem(id,...r))}}

const KEY='doudou-words-v2';
function fresh(){return {decks:SAMPLE.map(d=>mkDeck(d.id,d.name,d.items)),active:'animals',food:3,stars:0,snd:true,
  pet:{name:'豆豆',xp:0,hunger:60,t:Date.now(),sp:'leaf'},owned:['plant'],equip:{},roomOff:[],dex:[],badges:{},stepsV:2,pats:{},srs:{},wc:{},day:null,streak:{last:'',n:0},newPerDay:5,maxReview:5,history:[]}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.decks){S=fresh();migrateV1()}
S.pet.sp=S.pet.sp||'leaf';S.owned=S.owned||['plant'];S.equip=S.equip||{};S.roomOff=S.roomOff||[];S.dex=S.dex||[];S.badges=S.badges||{};
if(!S.exV){S.exV=1;const ne={};SAMPLE.forEach(d=>d.items.forEach(r=>ne[d.id+'|'+r[0]]=r));S.decks.forEach(d=>d.items.forEach(it=>{const r=ne[it.id];if(r){it.ex=r[2];it.exZh=r[3]}}));if(S.day&&S.day.gen&&S.day.gen.failed)delete S.day.gen;save()}
if(!S.revV){S.revV=1;S.newPerDay=5;S.maxReview=5;if(S.day&&!S.day.started&&!S.day.done)S.day=null;save()}
if(!S.stepsV){if(S.day&&S.day.step>=1)S.day.step+=2;S.stepsV=2;save()} // 新增两关后，进行中的进度往后挪
function migrateV1(){try{const o=JSON.parse(localStorage.getItem('doudou-words-v1'));if(!o)return;
  if(o.pet)S.pet=o.pet;S.food=o.food||S.food;S.stars=o.stars||0;
  (o.decks||[]).filter(d=>/^d\d/.test(d.id)).forEach(d=>{const words=(d.items||[]).filter(i=>!i.s).map(i=>mkItem(d.id,i.en,i.zh));
    (d.items||[]).filter(i=>i.s).forEach(s=>{const w=words.find(w=>!w.ex&&blankRe(w).test(s.en));if(w){w.ex=s.en;w.exZh=s.zh}});
    if(words.length)S.decks.push({id:d.id,name:d.name,items:words})});save()}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
const deck=()=>S.decks.find(d=>d.id===S.active)||S.decks[0];
function allItems(){return S.decks.flatMap(d=>d.items)}
function wordMap(){const m=new Map();allItems().forEach(i=>m.set(i.id,i));return m}
const blankRe=it=>new RegExp('\\b('+escRe(it.en.trim())+'(?:s|es|ed|d|ing)?)\\b','i');
const hasEx=it=>!!(it.ex&&blankRe(it).test(it.ex));

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function say(t,lang='en'){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  if(lang==='zh'){u.lang='zh-CN';u.rate=.9;const v=voices.find(v=>/zh[-_]CN/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));if(v)u.voice=v}
  else{u.lang='en-US';u.rate=t.includes(' ')&&t.split(' ').length>2?.78:.85;const v=voices.find(v=>/en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(v)u.voice=v}
  speechSynthesis.speak(u)}catch(e){}}

let AC;
function beep(kind){if(!S.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const notes=kind==='ok'?[660,880]:kind==='win'?[523,659,784,1046]:kind==='pop'?[740]:[220,180];
  notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='bad'?'square':'triangle';o.frequency.value=f;
    const t=AC.currentTime+i*.09;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.2)})}catch(e){}}
function floatAt(el,txt){const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='float';f.textContent=txt;
  f.style.left=(r.left+r.width/2-20)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
function reward(el,n=1){S.food+=n;S.stars+=n;save();hud();if(el)floatAt(el,'+'+n+'🍎')}
function hud(){$('#food').textContent=S.food;$('#streak').textContent=S.streak.n;$('#deckName').textContent=deck()?'· '+deck().name:'';$('#sndBtn').textContent=S.snd?'🔊':'🔇';$('#libBtn').classList.toggle('on',tab==='decks');$('#tabPrac').hidden=!S.showPractice}

/* ================= daily plan ================= */
function buildDay(force){
  const t=today();if(!force&&S.day&&S.day.date===t)return;
  const map=wordMap();
  const rev=Object.entries(S.srs).filter(([id,r])=>!r.mastered&&!r.moved&&r.due<=t&&map.has(id))
    .sort((a,b)=>a[1].due<b[1].due?-1:a[1].due>b[1].due?1:0).slice(0,S.maxReview||5).map(e=>e[0]);
  S.day={date:t,newIds:nextNew(S.newPerDay),revIds:rev,step:0,missed:{},started:false,done:false,...patPlan()};save();
}
/* 新词顺序：生词本最多 2 个 → 使用中的词库（包括新加进去的词）→ 生词本剩下的 → 其他词库。学过的同一个单词不重复学 */
function nextNew(n){const d=deck(),my=myDeck();const unl=dk=>dk?dk.items.filter(it=>!S.srs[it.id]):[];
  const myU=my&&d!==my?unl(my):[];const others=S.decks.filter(x=>x!==d&&x!==my&&x.id!=='dupmaster').flatMap(unl);
  const m=wordMap(),seen=new Set(Object.keys(S.srs).map(id=>m.get(id)).filter(Boolean).map(it=>it.en.toLowerCase()));
  return myU.slice(0,2).concat(unl(d),myU.slice(2),others).filter(it=>{const k=it.en.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,n).map(it=>it.id)}
function dayItems(){const m=wordMap();return [...S.day.revIds,...S.day.newIds].map(id=>m.get(id)).filter(Boolean)}

function markMiss(ctx,id){S.wc[id]=(S.wc[id]||0)+1;if(ctx.mode==='day')S.day.missed[id]=(S.day.missed[id]||0)+1;save()}
function good(ctx,el){ctx.ok=(ctx.ok||0)+1;reward(el,1)}

/* ================= flow engine ================= */
let RUN=0;const alive=ctx=>ctx.tok===RUN;
let keyH=null;
document.addEventListener('keydown',e=>{if(keyH&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))keyH(e)});

function flowShell(ctx){
  $('#view').innerHTML=`<div class="ghead"><button class="btn small" data-go="${ctx.mode==='day'?'today':'practice'}">← 暂停</button><h2 id="fTitle"></h2><span class="chip" id="fRound"></span></div>
   ${ctx.mode==='day'?'<div class="mini" id="mini"></div>':''}<div class="prog"><i id="progBar" style="width:0"></i></div><div id="gbody"></div>`;
}
function drawMini(i){const m=$('#mini');if(m)m.innerHTML=STEPS.map((s,k)=>`<i class="${k<i?'d':k===i?'c':''}" title="${s.name}"></i>`).join('')}
function roundUI(ctx,label){$('#fTitle').textContent=ctx.step.ico+' '+ctx.step.name;$('#fRound').textContent=label;
  const p=f=>{const b=$('#progBar');if(b)b.style.width=Math.round(f*100)+'%'};p(0);return {body:$('#gbody'),prog:p}}
function pause(ctx,title,detail,btn){return new Promise(res=>{if(!alive(ctx))return;$('#progBar').style.width='0';
  $('#gbody').innerHTML=`<div class="card result stack"><div class="ptitle">${title}</div><div>${detail}</div><div class="row center"><button class="btn sun" id="pgo">${btn}</button></div></div>`;
  $('#pgo').onclick=()=>res();$('#pgo').focus()})}
const chips=(ids,cls='miss')=>{const m=wordMap();return `<div class="wordchips center">${[...ids].map(id=>m.get(id)).filter(Boolean).map(i=>`<span class="wc ${cls}">${esc(i.en)} ${esc(i.zh)}</span>`).join('')}</div>`};

async function masteryLoop(ctx,list,roundFn){
  let n=1,wrong=await roundFn(list,`第 1 轮 · 全部 ${list.length} 个`);
  if(!alive(ctx))return;
  wrong.forEach(id=>markMiss(ctx,id)); // 第一次出错的记录下来
  while(wrong.size){
    while(wrong.size){
      await pause(ctx,`有 ${wrong.size} 个词还没过关`,chips(wrong)+'<p>我们把它们单独再练一次！</p>','错词再练');if(!alive(ctx))return;
      const sub=list.filter(x=>wrong.has(x.id));n++;
      wrong=await roundFn(sub,`第 ${n} 轮 · 错词 ${sub.length} 个`);if(!alive(ctx))return;
    }
    if(list.length<2)break;
    await pause(ctx,'错词都过关啦！','最后把全部单词再刷一遍，全对就过关。','开始最后一轮');if(!alive(ctx))return;
    n++;wrong=await roundFn(list,`第 ${n} 轮 · 全部再刷一遍`);if(!alive(ctx))return;
  }
}
function distract(ctx,it,key,n){

  for(const x of shuffle(ctx.pool).concat(shuffle(allItems()))){const v=x[key].toLowerCase();if(!seen.has(v)){seen.add(v);out.push(x)}if(out.length>=n)break}
  return out;
}

/* 听音拼写一个词：返回是否第一次就拼对；错两次显示答案 */
function spellOne(ctx,ui,it,extraHTML){return new Promise(res=>{
  if(!alive(ctx))return;
  const chars=[...it.en.toLowerCase()],need=chars.filter(c=>c!==' ');
  const alpha='abcdefghijklmnopqrstuvwxyz',extra=[];while(extra.length<Math.min(3,Math.max(2,Math.ceil(need.length/3))))extra.push(alpha[Math.random()*26|0]);
  const tiles=shuffle(need.concat(extra));let filled=[],tries=0,busy=false;
  ui.body.innerHTML=`${extraHTML||''}<div class="card prompt"><button class="speaker" id="spk" aria-label="再听一遍">🔊</button>
    <div class="hint">听读音，拼出这个单词 · ${need.length} 个字母</div><button class="linkbtn" id="zhh">看中文提示</button><div class="reveal" id="zhv" hidden style="font-family:var(--f-zh)">${esc(it.zh)}</div>
    <div class="slots" id="slots" style="margin-top:14px"></div></div>
    <div class="letters">${tiles.map((c,k)=>`<button class="letter" data-k="${k}">${esc(c)}</button>`).join('')}</div>
    <div class="row center" style="margin-top:16px"><button class="btn" id="back">⌫ 退格</button></div>`;
  const play=()=>say(it.en);setTimeout(play,150);$('#spk').onclick=play;
  $('#zhh').onclick=()=>{$('#zhv').hidden=false;$('#zhh').hidden=true};
  function draw(cls){let n=0;$('#slots').innerHTML=chars.map(c=>{if(c===' ')return '<span class="slot gap"></span>';const f=filled[n++];return `<span class="slot ${f?'filled':''} ${cls||''}">${f?esc(f.c):''}</span>`}).join('')}
  draw();
  const btns=[...ui.body.querySelectorAll('.letter')];
  function put(b){if(busy||b.classList.contains('used')||filled.length>=need.length)return;b.classList.add('used');filled.push({c:tiles[+b.dataset.k],b});beep('pop');draw();if(filled.length===need.length)check()}
  function undo(){if(busy)return;const f=filled.pop();if(f){f.b.classList.remove('used');draw()}}
  btns.forEach(b=>b.onclick=()=>put(b));$('#back').onclick=undo;
  keyH=e=>{if(!document.querySelector('.letters'))return;if(e.key==='Backspace'){e.preventDefault();undo();return}const k=e.key.toLowerCase();if(k.length!==1)return;const b=btns.find(x=>!x.classList.contains('used')&&tiles[+x.dataset.k]===k);if(b)put(b)};
  function check(){
    busy=true;
    if(filled.map(f=>f.c).join('')===need.join('')){draw('right');beep('ok');say(it.en);if(tries===0)good(ctx,$('#slots'));setTimeout(()=>res(tries===0),1100)}
    else{tries++;beep('bad');$('#slots').classList.add('bad');
      setTimeout(()=>{$('#slots').classList.remove('bad');
        if(tries>=2){filled=need.map(c=>({c}));draw('reveal-ans');$('#zhv').hidden=false;say(it.en);toast('正确拼法：'+it.en);setTimeout(()=>res(false),2400)}
        else{filled.forEach(f=>f.b.classList.remove('used'));filled=[];draw();busy=false;toast('不对哦，再听一遍，再拼一次');play()}},500)}
  }
})}
async function spellRound(ctx,list,label){
  const ui=roundUI(ctx,label),wrong=new Set(),qs=shuffle(list);
  for(let i=0;i<qs.length;i++){ui.prog(i/qs.length);const ok=await spellOne(ctx,ui,qs[i]);if(!alive(ctx))return wrong;if(!ok)wrong.add(qs[i].id)}
  keyH=null;return wrong;
}
/* 听音拼写：先全部拼一轮；拼错的词轮流再拼，每个词要连续拼对 5 次才过关，中间拼错就重新数 */
const SPELL_N=5;
async function spellStep(ctx,list){
  const wrong=await spellRound(ctx,list,`第 1 轮 · 全部 ${list.length} 个`);if(!alive(ctx))return;
  wrong.forEach(id=>markMiss(ctx,id));if(!wrong.size)return;
  const queue=list.filter(x=>wrong.has(x.id)),cnt={};queue.forEach(x=>cnt[x.id]=0);
  await pause(ctx,`有 ${queue.length} 个词拼错了`,chips(wrong)+`<p>这些词每个都要<b>连续拼对 ${SPELL_N} 次</b>才过关，中间拼错就重新数。加油！</p>`,'开始强化');if(!alive(ctx))return;
  let k=0;
  while(queue.length){
    const it=queue[k%queue.length];
    const dots=n=>`<div class="sdots">${Array.from({length:SPELL_N},(_,j)=>`<i class="${j<n?'on':''}"></i>`).join('')}</div>`;
    const ui=roundUI(ctx,`错词强化 · 还剩 ${queue.length} 个`);const total=queue.length*SPELL_N;ui.prog(1-queue.reduce((a,x)=>a+SPELL_N-cnt[x.id],0)/(Object.keys(cnt).length*SPELL_N));
    const ok=await spellOne(ctx,ui,it,`<div class="sline">这个词已连续拼对 ${dots(cnt[it.id])}</div>`);if(!alive(ctx))return;
    if(ok){cnt[it.id]++;if(cnt[it.id]>=SPELL_N){queue.splice(queue.indexOf(it),1);toast(`${it.en} 连续拼对 ${SPELL_N} 次，过关！`);beep('win');continue}}
    else{if(cnt[it.id])toast(`拼错了，${it.en} 要重新数啦`);cnt[it.id]=0}
    k++;
  }
  keyH=null;
}

/* --- 句子补全 --- */
function splitBlank(it){const m=it.ex.match(blankRe(it));return {form:m[1],before:it.ex.slice(0,m.index),after:it.ex.slice(m.index+m[1].length)}}
/* 句子补全的干扰项：优先用 AI 给的「放进去一定不通」的词，否则用别的主题词库里的词，避免几个选项都说得通 */
function fillDistract(it){
  const seen=new Set([it.en.toLowerCase()]),out=[];
  for(const w of (it.wrong||[])){const v=String(w||'').trim();if(v&&!seen.has(v.toLowerCase())&&v.split(' ').length<=2){seen.add(v.toLowerCase());out.push({en:v,id:'w'+v})}if(out.length>=3)return out}
  const dk=it.id.split('|')[0];
  for(const x of shuffle(allItems().filter(x=>x.id.split('|')[0]!==dk)).concat(shuffle(allItems()))){const v=x.en.toLowerCase();if(!seen.has(v)){seen.add(v);out.push(x)}if(out.length>=3)break}
  return out}
function fillRound(ctx,list,label){return new Promise(res=>{
  const ui=roundUI(ctx,label),wrong=new Set(),qs=shuffle(list);let i=0;
  function q(){
    if(!alive(ctx))return;if(i>=qs.length)return res(wrong);ui.prog(i/qs.length);
    const it=qs[i],sp=splitBlank(it),opts=shuffle([it].concat(fillDistract(it)));
    ui.body.innerHTML=`<div class="card prompt"><div class="sent">${wordSpans(sp.before)}<span class="blank" id="bl">？</span>${wordSpans(sp.after)}</div></div>
      <div class="opts" style="margin-top:14px">${opts.map((o,k)=>`<button class="opt enopt" data-k="${k}">${esc(o.en)}</button>`).join('')}</div>`;
    let done=false;
    ui.body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(done)return;done=true;const o=opts[+b.dataset.k],bl=$('#bl');bl.textContent=sp.form;bl.classList.add('filled');
      if(o===it){b.classList.add('right');bl.classList.add('right');beep('ok');good(ctx,b);say(it.ex);i++;setTimeout(q,1700)}
      else{b.classList.add('wrong','bad');bl.classList.add('wrongb');beep('bad');wrong.add(it.id);ui.body.querySelectorAll('.opt')[opts.indexOf(it)].classList.add('right');say(it.ex);i++;setTimeout(q,2600)}
    });
  }
  q();
})}

function tokens(en){const m=en.trim().match(/^(.*?)([.?!。？！]*)$/);return {w:m[1].split(/\s+/).filter(Boolean),p:m[2]}}
function buildRound(ctx,list,label){return new Promise(res=>{
  const ui=roundUI(ctx,label),wrong=new Set(),qs=shuffle(list);let i=0;
  function q(){
    if(!alive(ctx))return;if(i>=qs.length)return res(wrong);ui.prog(i/qs.length);
    const it=qs[i],{w,p}=tokens(it.ex);let order=shuffle(w.map((x,k)=>k));
    if(w.length>1){let g=0;while(order.every((v,k)=>w[v]===w[k])&&g++<20)order=shuffle(order)}
    let ans=[],tries=0;
    ui.body.innerHTML=`<div class="card prompt"><div class="zh">${esc(it.exZh)}</div><div class="hint">把下面的单词按顺序点上去，翻译成英文</div><div class="hint" id="ansHint" hidden></div></div>

    function draw(){ansEl.innerHTML='';ans.forEach((a,n)=>{const c=document.createElement('button');c.className='wchip';c.textContent=a.v;

function clozeRound(ctx,list,story){return new Promise(res=>{
  let first=true,sel=0;const wrong=new Set();
  const blanks=story?story.blanks.map(b=>({...b,val:null,vj:null,state:''})):shuffle(list).map((it,k)=>{const sp=splitBlank(it);return {it,...sp,before:(k?' ':'')+sp.before,val:null,vj:null,state:''}});
  const ui=roundUI(ctx,`短文里有 ${blanks.length} 个空`);
  const used=new Set(list.map(i=>i.en.toLowerCase())),dis=[];
  for(const x of shuffle(allItems())){const v=x.en.toLowerCase();if(!used.has(v)){used.add(v);dis.push(x.en)}if(dis.length>=(list.length>=3?2:1))break}
  const bank=shuffle(blanks.map(b=>b.it.en).concat(dis));
  function draw(){
    if(!alive(ctx))return;
    const filled=blanks.filter(b=>b.state==='right').length;ui.prog(filled/blanks.length);
    ui.body.innerHTML=`<div class="card"><div class="passage">${blanks.map((b,k)=>`${wordSpans(b.before)}<button class="blank ${b.val?'filled':''} ${b.state} ${k===sel&&b.state!=='right'?'sel':''}" data-b="${k}">${b.val?esc(b.state==='right'?b.form:b.val):'('+(k+1)+')'}</button>${wordSpans(b.after)}`).join('')}</div></div>
      <div class="pool">${bank.map((w,j)=>`<button class="wchip ${blanks.some(b=>b.vj===j)?'used':''}" data-w="${j}">${esc(w)}</button>`).join('')}</div>
      <div class="row center" style="margin-top:16px"><button class="btn go" id="chk" ${blanks.every(b=>b.val)?'':'disabled'}>检查</button></div>`;
    ui.body.querySelectorAll('.blank').forEach(el=>el.onclick=()=>{const k=+el.dataset.b,b=blanks[k];if(b.state==='right')return;
      if(b.val){b.val=null;b.vj=null}sel=k;draw()});
    ui.body.querySelectorAll('[data-w]').forEach(el=>el.onclick=()=>{const j=+el.dataset.w;if(blanks.some(b=>b.vj===j))return;
      let k=blanks[sel]&&!blanks[sel].val?sel:blanks.findIndex(b=>!b.val);if(k<0)return;
      blanks[k].val=bank[j];blanks[k].vj=j;blanks[k].state='';beep('pop');
      const nx=blanks.findIndex(b=>!b.val);sel=nx<0?k:nx;draw()});
    $('#chk').onclick=check;
  }
  function check(){
    let bad=0;
    blanks.forEach(b=>{if(b.state==='right')return;if(b.val.toLowerCase()===b.it.en.toLowerCase()){b.state='right';if(first)good(ctx,null)}
      else{b.state='wrongb';bad++;if(!wrong.has(b.it.id)){wrong.add(b.it.id);if(first)markMiss(ctx,b.it.id)}}});
    first=false;draw();
    if(!bad){beep('win');$('#chk').outerHTML='<button class="btn sun" id="cont">🔊 听短文，然后继续</button>';
      say(story?story.text:blanks.map(b=>b.it.ex).join(' '));$('#cont').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}res(wrong)};return}
    beep('bad');toast(`有 ${bad} 个空填错了，再想想！`);
    setTimeout(()=>{blanks.forEach(b=>{if(b.state==='wrongb'){b.val=null;b.vj=null;b.state=''}});sel=blanks.findIndex(b=>!b.val);draw()},1100);
  }
  draw();
})}

  const res=!p.custom&&!cue&&p.a!=='{x}'?[tmplRe(p.a)]:[];

  let ui=roundUI(ctx,label+' · 回答');
  const t1=speakTask(ctx,ui,`<div class="secl">${pet}问你</div><button class="cbt" data-sayline="${esc(p.q)}" style="font-size:22px">🔊 ${esc(p.q)}</button>

async function patternStep(ctx){
  if(ctx.mode!=='day'){const ids=allPatIds(),p=patById(ids[Math.random()*ids.length|0]);await learnCard(ctx,p,shuffle(p.xs).slice(0,2));if(!alive(ctx))return;await drill(ctx,p,'练习');return}
  ensurePats();const d=S.day;d.patRes=d.patRes||{};
  const rev=d.patRev.filter(i=>patById(i)&&!(i in d.patRes));
  if(rev.length){
    await pause(ctx,'考一考',`看看之前学的问句还记不记得，一共 ${rev.length} 句。不看例句，直接说！`,'开始考');if(!alive(ctx))return;
    for(let k=0;k<rev.length;k++){const ok=await drill(ctx,patById(rev[k]),`考一考 ${k+1}/${rev.length}`);if(!alive(ctx))return;d.patRes[rev[k]]=ok;save()}
    const wrong=d.patRev.filter(i=>d.patRes[i]===false&&patById(i));
    if(wrong.length){
      await pause(ctx,`有 ${wrong.length} 句还不太熟`,`<div class="wordchips center">${wrong.map(i=>`<span class="wc miss">${esc(patById(i).q)}</span>`).join('')}</div><p>我们再看一遍，明天还会再考它们。</p>`,'再学一遍');if(!alive(ctx))return;
      for(const i of wrong){const p=patById(i);await learnCard(ctx,p,shuffle(p.xs).slice(0,2),'再学一遍');if(!alive(ctx))return}
    }
  }
  const nw=d.patNew.filter(i=>patById(i)&&!(d.patLearned||[]).includes(i));
  if(nw.length){
    await pause(ctx,'学新问句',`今天学 ${nw.length} 个问句，每句都要会回答、会提问。<br>明天会直接考哦！`,'开始学');if(!alive(ctx))return;
    for(let k=0;k<nw.length;k++){const p=patById(nw[k]);
      await learnCard(ctx,p,shuffle(p.xs).slice(0,2),`新问句 ${k+1}/${nw.length}`);if(!alive(ctx))return;
      await drill(ctx,p,`练习 ${k+1}/${nw.length}`);if(!alive(ctx))return;
      d.patLearned=(d.patLearned||[]).concat(nw[k]);save()}
  }
}
function finishPats(t){const d=S.day;S.pats=S.pats||{};if(!d.patNew)return;
  for(const i of d.patRev){const r=S.pats[i];if(!r||!(d.patRes&&i in d.patRes))continue;
    if(d.patRes[i]){r.st++;if(r.st>=INTERVALS.length){r.mastered=true;r.masteredOn=t}else r.due=addDays(t,INTERVALS[r.st])}else{r.st=0;r.due=addDays(t,INTERVALS[0])}}
  for(const i of (d.patLearned||d.patNew))if(!S.pats[i]&&patById(i))S.pats[i]={st:0,due:addDays(t,INTERVALS[0]),learned:t};
}

function parseDialog(text){const out=[];
  for(let l of text.split(/\r?\n/)){l=l.trim();if(!l||l.startsWith('#'))continue;let q,a,t='';
    if(/[|｜\t]/.test(l)){[q,a,t='']=l.split(/\s*[|｜\t]\s*/)}
    else{const k=l.indexOf('?');if(k<0||k===l.length-1)continue;q=l.slice(0,k+1);a=l.slice(k+1)}
    q=(q||'').trim();a=(a||'').trim();if(!q||!a||CJK.test(q)||CJK.test(a))continue;
    q=q.replace(/[.?!。？]*$/,'?');q=q[0].toUpperCase()+q.slice(1);out.push({q,a:tidy(a),t:t.trim()})}
  return out}
function addDialogs(list){S.myPats=S.myPats||[];let n=0;const have=new Set(S.myPats.map(p=>normEn(p.q)).concat(PATTERNS.map(p=>normEn(p.q))));

function listen(onText,onEnd,hold){

  const finish=()=>{if(done)return;done=true;clearTimeout(wd);onEnd(got)};

    r.onstart=r.onaudiostart=()=>{alive=true};
    r.onresult=e=>{got=true;alive=true;let t='';for(const x of e.results)t+=x[0].transcript;onText(t)};
    r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))srFail();finish()};
    r.onend=finish;r.start();

const ketCount=()=>{const s=new Set();KET_WORDS.forEach(([t,str])=>str.split(';').forEach(p=>s.add(p.split('=')[0].toLowerCase())));return s.size};
function importKetWords(){
  const words=[];const seen=new Set();
  KET_WORDS.forEach(([t,str])=>str.split(';').forEach(p=>{const [en,zh]=p.split('=');const k=en.toLowerCase();if(en&&zh&&!seen.has(k)){seen.add(k);words.push({en,zh})}}));
  const {fresh,dup}=splitMastered(words);let d=S.decks.find(x=>x.id==='pk_ket');if(!d){d={id:'pk_ket',name:'KET 核心词汇',items:[]};S.decks.push(d)}
  const n=addWords(d,fresh);save();return {n,dup:dup.length}}

function packWords(pk){const seen=new Set(),out=[];for(const p of pk.pairs()){const i=p.indexOf('=');if(i<1)continue;const en=p.slice(0,i).trim(),zh=p.slice(i+1).trim(),k=en.toLowerCase();if(!seen.has(k)){seen.add(k);out.push({en,zh})}}return out}
function importPack(id){const pk=WORD_PACKS.find(x=>x.id===id);const {fresh,dup}=splitMastered(packWords(pk));
  let d=S.decks.find(x=>x.id===id);if(!d){d={id,name:pk.name,items:[]};S.decks.push(d)}const n=addWords(d,fresh);save();return {n,dup:dup.length}}

function runStep(ctx,step){
  if(step.key==='talk')return patternStep(ctx);
  const gen=step.key==='fill'||step.key==='cloze';
  const list=step.ex?ctx.items.map(it=>gen&&ctx.mode==='day'?genFor(it):it).filter(hasEx):ctx.items;
  if(!list.length)return Promise.resolve();
  switch(step.key){
    case 'match':return masteryLoop(ctx,list,(l,lab)=>matchRound(ctx,l,lab));
    case 'venzh':case 'vzhen':case 'enzh':case 'zhen':return masteryLoop(ctx,list,(l,lab)=>choiceRound(ctx,l,lab,step.key));
    case 'spell':return spellStep(ctx,list);
    case 'fill':return masteryLoop(ctx,list,(l,lab)=>fillRound(ctx,l,lab));
    case 'read':return readPass(ctx,list);
    case 'build':return masteryLoop(ctx,list,(l,lab)=>buildRound(ctx,l,lab));
    case 'cloze':return list.length>=2?clozeRound(ctx,list,ctx.mode==='day'?genStory(list):null):Promise.resolve();
  }
}

async function runDay(){
  buildDay();const items=dayItems();if(!items.length)return go('today');
  const ctx={tok:++RUN,mode:'day',items,pool:items};
  S.day.started=true;save();flowShell(ctx);window.scrollTo(0,0);
  for(let i=S.day.step;i<STEPS.length;i++){
    const step=STEPS[i];ctx.step=step;drawMini(i);
    if(step.key==='fill'||step.key==='cloze'){await ensureGen(ctx);if(!alive(ctx))return}
    const n=step.key==='talk'?patCount():step.ex?items.map(it=>step.key==='fill'||step.key==='cloze'?genFor(it):it).filter(hasEx).length:items.length;
    if(!n||(step.key==='cloze'&&n<2)){S.day.step=i+1;save();continue}
    $('#fTitle').textContent=step.ico+' '+step.name;$('#fRound').textContent=`第 ${i+1}/${STEPS.length} 关`;
    await pause(ctx,`第 ${i+1} 关：${step.name}`,`<p>${step.desc}</p><p class="hint">${step.key==='talk'?patSummary():step.ex?n+' 个句子':n+' 个单词'}</p>`,'开始');
    if(!alive(ctx))return;
    await runStep(ctx,step);if(!alive(ctx))return;
    S.day.step=i+1;save();beep('win');
  }
  finishDay(ctx);
}
function finishDay(ctx){
  const t=today(),d=S.day,newly=[];
  for(const id of d.revIds){const r=S.srs[id];if(!r)continue;r.reviews=(r.reviews||0)+1;r.last=t;
    if(d.missed[id]){r.st=0;r.due=addDays(t,INTERVALS[0])}else{r.st++;if(r.st>=INTERVALS.length){r.mastered=true;r.masteredOn=t;newly.push(id)}else r.due=addDays(t,INTERVALS[r.st])}}
  for(const id of d.newIds){S.srs[id]={st:0,due:addDays(t,INTERVALS[0]),learned:t,last:t,reviews:0}}
  if(S.streak.last!==t){S.streak.n=S.streak.last===addDays(t,-1)?S.streak.n+1:1;S.streak.last=t}
  S.history.push({date:t,n:d.newIds.length,r:d.revIds.length,miss:Object.keys(d.missed).length});
  finishPats(t);{const m=applyXp(30);bubbleText=m||'今天的任务完成啦！我也长大了一点～喂我吃苹果吧！'}d.done=true;d.mastered=newly;S.food+=5;save();hud();checkBadges();beep('win');
  go('today');toast('任务完成！奖励 5 个苹果 🍎');
}
function dueOn(date){return Object.values(S.srs).filter(r=>!r.mastered&&r.due<=date).length}

 {t:'睡觉',l:[['p',"I'm sleepy.","我困了。"],['k',"It's time for bed.","该睡觉了。"],['p',"Good night!","晚安！"],['k',"Good night! Sweet dreams.","晚安！做个好梦。"]]},
 {t:'生日',l:[['p',"Today is my birthday!","今天是我的生日！"],['k',"Happy birthday to you!","祝你生日快乐！"],['p',"Thank you! Let's eat some cake.","谢谢！我们吃蛋糕吧。"],['k',"Yummy! I like cake.","好吃！我喜欢蛋糕。"]]},
 {t:'年龄',l:[['p',"How old are you?","你几岁了？"],['k',"I'm eight years old.","我八岁了。"],['p',"Wow! I am only one.","哇！我才一岁。"],['k',"You are so little!","你好小呀！"]]},
 {t:'运动',l:[['p',"Can you swim?","你会游泳吗？"],['k',"Yes, I can.","是的，我会。"],['p',"Can you fly like a bird?","你会像小鸟一样飞吗？"],['k',"No, I can't.","不，我不会。"]]}];

function startTalk(){
  let pool=DIALOGS.filter(d=>!(S.talkSeen||[]).includes(d.t));if(!pool.length){S.talkSeen=[];pool=DIALOGS}
  const d=pool[Math.random()*pool.length|0];S.talkSeen=(S.talkSeen||[]).concat(d.t);save();
  talk={mode:'script',d,i:0,log:[],zh:talk?talk.zh:false};advance();
  const t=$('#talkCard');if(t)t.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function advance(){
  if(!talk||talk.mode!=='script')return;
  const l=talk.d.l[talk.i];
  if(!l){finishTalk();return}
  if(l[0]==='p'){
    talk.log.push({who:'p',en:l[1],zh:l[2]});setBubble(l[1]);say(l[1]);anim('wiggle');talk.i++;
    const nx=talk.d.l[talk.i];
    if(nx&&nx[0]==='p'){drawTalk();const tk=talk;setTimeout(()=>{if(talk===tk&&$('#talkBody'))advance()},1600);return}
    return advance();
  }
  const {w}=tokens(l[1]);let order=shuffle(w.map((x,k)=>k));
  if(w.length>1){let g=0;while(order.every((v,k)=>w[v]===w[k])&&g++<20)order=shuffle(order)}
  talk.kid={en:l[1],zh:l[2],w,order,ans:[],tries:0,showAns:false};drawTalk();
}
function finishTalk(){
  talk.done=true;S.chatOk=(S.chatOk||0)+1;
  const td=today();if(S.chatDay!==td){S.chatDay=td;S.chatN=0}
  talk.got=0;if(S.chatN<10){talk.got=2;S.chatN+=2;S.food+=2;S.stars+=2}
  save();hud();beep('win');setBubble('That was fun!  聊得真开心！');checkBadges();drawTalk();
}
function startFree(){
  const n=S.pet.name;talk={mode:'free',log:[{who:'p',en:"Hi! Let's talk in English!",zh:`嗨！我是${n}，我们用英语聊天吧！`}],sug:"Hello! How are you?",zh:talk?talk.zh:false,busy:false};
  setBubble("Hi! Let's talk in English!");say("Hi! Let's talk in English!");drawTalk();
}
const normS=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
async function sendFree(){
  const inp=$('#fIn');if(!inp||!talk||talk.busy)return;const txt=inp.value.trim();if(!txt)return;
  talk.log.push({who:'k',en:txt});talk.busy=true;talk.sug='';drawTalk();const tk=talk;
  try{
    const hist=talk.log.slice(-10).map(m=>(m.who==='p'?'宠物':'孩子')+'：'+m.en).join('\n');
    const r=await aiJSON(`你是儿童背单词 app 里的小宠物「${S.pet.name}」，正在和一个中国小学生（6-10 岁）用英语聊天，帮他练习口语。
规则：只用小学低年级的简单英语，1-2 个短句，每句不超过 8 个词；语气活泼友好，多夸奖；最好用一个简单的问题结尾，让对话继续下去；如果孩子写了中文或说不出来，就用简单英语回应，并在 try 里教他这句话用英语怎么说；如果孩子的英语有语法或拼写错误，在 fix 里写出改正后的整句（没有错误就留空字符串）；话题保持适合儿童。
只回复一个 JSON 对象：{"en":"你的英文回复","zh":"这句回复的中文翻译","fix":"改正后的孩子句子或空字符串","try":"建议孩子下一句可以说的简单英文"}
对话记录：
${hist}`);
    if(talk!==tk)return;
    const last=talk.log[talk.log.length-1];
    if(r&&r.fix&&String(r.fix).trim()&&normS(r.fix)!==normS(txt))last.fix=String(r.fix).trim();
    const en=String(r&&r.en||'').trim()||'Hmm? Can you say it again?';
    talk.log.push({who:'p',en,zh:String(r&&r.zh||'')});talk.sug=String(r&&r.try||'');setBubble(en);say(en);anim('wiggle');
  }catch(e){if(talk!==tk)return;const c=e&&e.code;
    talk.log.push({who:'p',en:"Sorry, I didn't hear you.",zh:'（'+aiErrMsg(e)+'）'})}
  talk.busy=false;drawTalk();const f=$('#fIn');if(f)f.focus();
}
function logHTML(){
  return `<div class="chatlog" id="chatlog">${talk.log.map(m=>`<div class="cb ${m.who}"><span class="cbw">${m.who==='p'?esc(S.pet.name):'我'}</span>
    <button class="cbt" data-sayline="${esc(m.en)}">${esc(m.en)}</button>
    ${m.fix?`<small class="fix">更地道的说法：<b>${esc(m.fix)}</b></small>`:''}</div>`).join('')}
    ${talk.busy?`<div class="cb p"><span class="cbw">${esc(S.pet.name)}</span><span class="cbt">…</span></div>`:''}</div>`;
}
function talkHTML(){
  if(stage()===0)return `<p class="sub center" style="margin:0">${esc(S.pet.name)}还在蛋里，孵出来才能聊天哦。</p>`;
  const freeBtn=aiReady()?'<button class="btn" id="freeGo">✨ 自由聊天</button>':'';
  if(!talk)return `<p class="sub center" style="margin:0 0 10px">${esc(S.pet.name)}先说一句，你用英语说出你的回答。完成一段对话得 2 个苹果（每天最多 10 个），赚到的苹果可以喂豆豆、摸头、玩游戏。</p>
    <div class="row center"><button class="btn go" id="talkGo">💬 开始对话</button>${freeBtn}</div>`;
  const top=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="tag2">${talk.mode==='free'?'自由聊天':'话题：'+talk.d.t}</span></div>`;
  if(talk.mode==='free')return top+logHTML()+`
    ${talk.sug?`<div class="row" style="margin-top:8px;gap:6px"><span class="hint" style="margin:0">可以这样说：</span><button class="wchip sug" id="fSug">${esc(talk.sug)}</button></div>`:''}
    <form class="row" id="fForm" style="margin-top:10px;flex-wrap:nowrap">${srOK?'<button type="button" class="btn" id="fMic" aria-label="语音输入">🎤</button>':''}<input type="text" id="fIn" placeholder="${srOK?'用英语说点什么…':'用英语说点什么（可以用键盘上的 🎤）'}" autocomplete="off" ${talk.busy?'disabled':''}><button class="btn go" ${talk.busy?'disabled':''}>发送</button></form>
    <div class="row center" style="margin-top:10px"><button class="btn small" id="talkGo">换成对话练习</button></div>`;
  if(talk.done)return top+logHTML()+`<div class="card result" style="margin-top:12px;box-shadow:none"><div class="ptitle">对话完成！</div>
    <p style="margin:6px 0">${talk.got?`得到 ${talk.got} 个苹果 🍎`:'今天聊天的苹果已经拿满啦，继续练习也很棒！'}</p>
    <div class="row center"><button class="btn sun" id="talkGo">再聊一段</button>${freeBtn}</div></div>`;
  const k=talk.kid;
  return top+logHTML()+(k?`<div class="kidturn"><div class="secl">轮到你回答${esc(S.pet.name)}</div>${speakBoxHTML()}</div>`:'');
}
function drawTalk(){const b=$('#talkBody');if(!b)return;b.innerHTML=talkHTML();bindTalk();const lg=$('#chatlog');if(lg)lg.scrollTop=lg.scrollHeight}
function bindTalk(){
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};
  on('#talkGo',startTalk);on('#freeGo',startFree);
  on('#tZh',()=>{talk.zh=!talk.zh;drawTalk()});
  on('#fSug',()=>{const f=$('#fIn');if(f){f.value=talk.sug;f.focus()}});
  const fm=$('#fForm');if(fm)fm.onsubmit=e=>{e.preventDefault();sendFree()};
  document.querySelectorAll('[data-sayline]').forEach(b=>b.onclick=()=>say(b.dataset.sayline));
  const fmic=$('#fMic');if(fmic)fmic.onclick=()=>{const f=$('#fIn');f.value='';const r=listen(t=>{f.value=t},()=>{fmic.classList.remove('on');if(f.value.trim())sendFree()});if(r)fmic.classList.add('on');else fmic.hidden=true};
  const k=talk&&talk.kid;if(!k)return;
  const refs=[k.en];let busy=false;
  const lastPet=[...talk.log].reverse().find(m=>m.who==='p');
  const moveOn=line=>{talk.log.push({who:'k',en:line});talk.kid=null;talk.i++;drawTalk();const tk=talk;setTimeout(()=>{if(talk===tk&&$('#talkBody'))advance()},Math.max(1300,line.length*75))};
  bindSpeakBox(async said=>{
    if(busy)return;busy=true;const fb=$('#sayFb');fb.hidden=false;fb.className='sayfb';fb.textContent='正在听你说得对不对…';
    const r=await judgeSpeech({situation:`孩子在和宠物用英语聊天，话题是${talk.d.t}。宠物刚说："${lastPet?lastPet.en:''}"，孩子要接着回答。`,refs,said});
    busy=false;if(!talk||talk.kid!==k)return;
    if(r.ok){beep('ok');say(r.fixed);moveOn(r.fixed)}
    else{k.tries=(k.tries||0)+1;beep('bad');refs.unshift(r.fixed);fb.className='sayfb no';
      fb.innerHTML=`你说的是：${esc(said)}<br>更好的说法：<b>${esc(r.fixed)}</b> <button class="btn small" id="fbSay" type="button">🔊</button>${r.tip?`<br><small>${esc(r.tip)}</small>`:''}<br>${k.tries>=2?'<button class="btn small sun" id="fbGo" type="button">继续</button>':'跟着再说一遍吧！'}`;
      say(r.fixed);$('#fbSay').onclick=()=>say(r.fixed);$('#sayIn').value='';const g=$('#fbGo');if(g)g.onclick=()=>moveOn(r.fixed)}
  });
}

  return (egg?'<p class="hint" style="margin:0 0 8px">衣服可以先买好，孵出来就能穿上。</p>':'')+SLOTS.map(([slot,label])=>`<div class="secl">${label}</div>
    <div class="shop">${ITEMS.filter(i=>i.slot===slot).map(it=>{const own=S.owned.includes(it.id);let act;
      if(!own)act=it.badge?`<span class="tag2">🔒 ${BADGES.find(b=>b.id===it.badge).name}徽章</span>`:`<button class="btn small sun" data-buy="${it.id}" ${S.food<it.price?'disabled':''}>🍎 ${it.price}</button>`;
      else if(slot==='room')act=`<button class="btn small" data-room="${it.id}">${S.roomOff.includes(it.id)?'摆出来':'收起来'}</button>`;
      else act=`<button class="btn small ${S.equip[slot]===it.id?'':'go'}" data-wear="${it.id}">${S.equip[slot]===it.id?'脱下':'穿上'}</button>`;
      return `<div class="sitem ${own?'own':''}"><span class="ic">${it.ic}</span><b>${it.name}</b>${act}</div>`}).join('')}</div>`).join('');
}

function setBubble(t){bubbleText=t;const b=$('#bubble');if(b){b.textContent=t;b.classList.toggle('enb',!CJK.test(t))}}
function anim(c){const g=$('#petG');if(!g)return;g.classList.remove('bob');g.classList.add(c);setTimeout(()=>{g.classList.remove(c);g.classList.add('bob')},1000)}
function feed(){
  const p=S.pet;talk=null;
  if(S.food<=0){setBubble('苹果吃完啦，去做今日任务就能赚苹果！');beep('bad');return}
  if(petNight()&&stage()>0){setBubble('呼…呼…（在睡觉呢，明天再喂吧）');return}
  if(p.hunger>=100){setBubble('吃不下啦，陪我玩一会儿吧！');return}
  const before=level();S.food--;p.hunger=Math.min(100,p.hunger+20);p.joy=Math.min(100,(p.joy??60)+3);
  const m=applyXp(15);const msg=m||['啊呜～好吃！','嚼嚼嚼…谢谢你！','苹果甜甜的！','还想再吃一个～'][Math.random()*4|0];
  save();beep('ok');bubbleText=msg;renderPet();hud();petFx('🍎',1,'drop');setTimeout(()=>anim('chomp'),500);if(level()>before){beep('win');petFx('✨',4)}
}
/* --- 宠物：成长、心情、互动、小游戏 --- */
function petNight(){const h=new Date().getHours();return h>=22||h<6}
function applyXp(n){const p=S.pet,b=level(),bst=stage();p.xp+=n;
  if(stage()!==bst){if(bst===0){if(p.name==='小蛋')p.name=spOf(p.sp).name;return `咔嚓！我破壳啦！我是${spOf(p.sp).name}，你好呀！`}return '哇！我变成'+spOf(p.sp).name+STAGE_NAME[stage()]+'啦！'}
  if(level()>b)return level()>=GRAD_LV?'我长成大王啦！可以毕业了！':'我升级啦！Lv.'+level();
  return ''}
function petFx(ch,n,cls){const box=$('.petstage');if(!box)return;
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='pfx '+(cls||'');s.textContent=ch;
    s.style.left=(40+Math.random()*20)+'%';s.style.top=(cls==='drop'?18:42+Math.random()*10)+'%';s.style.animationDelay=(i*0.12)+'s';box.appendChild(s);setTimeout(()=>s.remove(),1800)}}
function patPet(){
  const p=S.pet;if(stage()===0){anim('wiggle');beep('pop');return setBubble('（蛋开心地晃了晃）')}
  if(S.food<1){beep('bad');return setBubble('摸头要 1 个苹果哦，去和我聊天赚苹果吧！')}
  S.food--;hud();p.joy=Math.min(100,(p.joy??60)+8);const td=today();if(S.patDay!==td){S.patDay=td;S.patN=0}
  let msg=['嘿嘿，好舒服～','再摸一下！','你是我最好的朋友！','咕噜咕噜～'][Math.random()*4|0];
  if(S.patN<10){S.patN++;const m=applyXp(2);if(m)msg=m}

function csvSplit(l){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];
  if(q){if(c==='"'&&l[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
  else if(c==='"')q=true;else if(c===','||c==='，'){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(s=>s.trim())}
function boundary(l){const i=l.search(CJK);if(i<0)return null;let en,zh;
  if(i===0){const j=l.search(/[A-Za-z]/);if(j<0)return null;zh=l.slice(0,j);en=l.slice(j)}else{en=l.slice(0,i);zh=l.slice(i)}
  const sep=/^[\s|｜,，=＝:：\-–—"';；]+|[\s|｜,，=＝:：\-–—"';；]+$/g;return [en.replace(sep,''),zh.replace(sep,'')]}
const cleanEn=s=>s.replace(/\s+(n|v|vt|vi|adj|adv|prep|pron|conj|num|art|int)\.?$/i,'').replace(/\s+/g,' ').trim();
const isSentence=en=>en.trim().split(/\s+/).length>=3||/[.?!]$/.test(en.trim());
function parseText(text){
  const words=[],sents=[];
  for(let l of text.split(/\r?\n/)){
    l=l.trim();if(!l||l.startsWith('#'))continue;
    let f=null;
    if(/[|｜\t]/.test(l))f=l.split(/\s*[|｜\t]\s*/).map(s=>s.replace(/^"|"$/g,'').trim());
    else if(/[,，]/.test(l)){const c=csvSplit(l);if(c.length>=3)f=c}
    let en,zh,ex='',exZh='';
    if(f&&f.length>=2){[en,zh,ex='',exZh='']=f;if(CJK.test(en)&&!CJK.test(zh))[en,zh]=[zh,en];
      if(ex&&!exZh&&CJK.test(ex)){const b=boundary(ex);if(b)[ex,exZh]=b}}
    else{const b=boundary(l.replace(/^"|"$/g,''));if(!b)continue;[en,zh]=b}
    en=cleanEn(en||'');zh=(zh||'').trim();if(!en||!zh)continue;
    if(isSentence(en)&&!ex)sents.push({en,zh});else words.push({en,zh,ex,exZh});
  }
  let attached=0;
  for(const s of sents){const w=words.find(w=>!w.ex&&blankRe(w).test(s.en));if(w){w.ex=s.en;w.exZh=s.zh;attached++}}
  return {words,dropped:sents.length-attached};
}
function addWords(d,words){let n=0;for(const w of words){const it=mkItem(d.id,w.en,w.zh,w.ex,w.exZh);const old=d.items.find(x=>x.id===it.id);
  if(old){if(!old.ex&&it.ex){old.ex=it.ex;old.exZh=it.exZh}}else{d.items.push(it);n++}}return n}

async function arkCall(model,messages,temperature,ms){
  const c=aiCfg();if(!c.url||!model)throw {code:'not_configured'};
  const send=async(noThink)=>{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
    const body={model,messages,temperature,max_tokens:2000};if(noThink)body.thinking={type:'disabled'};
    try{return await fetch(c.url,{method:'POST',signal:ctl.signal,headers:Object.assign({'Content-Type':'application/json'},c.key?{Authorization:'Bearer '+c.key}:{}),body:JSON.stringify(body)})}
    catch(e){throw {code:ctl.signal.aborted?'timeout':'network'}}finally{clearTimeout(tm)}};
  let r=await send(true);
  if(r.status===400){const t=await r.text().catch(()=>'');if(/thinking/i.test(t))r=await send(false);else throw {code:'http400',status:400,msg:t}}
  if(!r.ok)throw {code:r.status===401||r.status===403?'auth':r.status===429?'rate_limited':r.status===400?'http400':'http',status:r.status};

const u8ToB64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
async function makeBackup(){const j=JSON.stringify(S);
  try{if(window.CompressionStream){const st=new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'));const b64=u8ToB64(new Uint8Array(await new Response(st).arrayBuffer()));return 'DOUDOU2:'+b64.length+':'+b64}}catch(e){}

async function readBackup(raw){
  const s=String(raw).replace(/[\s​-‍﻿]+/g,'').replace(/：/g,':');const m=s.match(/doudou([12]):([A-Za-z0-9+/=:]+)/i);
  if(!m)throw {msg:'没找到备份码，备份码以 DOUDOU 开头'};let j;
  if(m[1]==='2'){const k=m[2].indexOf(':'),len=+m[2].slice(0,k),b64=m[2].slice(k+1);
    if(!b64||b64.length<len)throw {msg:`备份码不完整：应该有 ${len} 个字符，现在只有 ${b64.length} 个，请重新完整复制`};
    if(!window.DecompressionStream)throw {msg:'这个浏览器版本太旧，读不了这个备份码，请用 Safari 打开'};
    try{const bin=atob(b64.slice(0,len)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      j=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}catch(e){throw {msg:'备份码损坏了，请重新复制'}}}
  else{try{j=decodeURIComponent(escape(atob(m[2].replace(/:/g,''))))}catch(e){throw {msg:'备份码不完整或被改动了（字母大小写也不能变），请重新完整复制'}}}
  let o;try{o=JSON.parse(j)}catch(e){throw {msg:'备份码不完整，请重新完整复制'}}
  if(!o||!Array.isArray(o.decks)||!o.pet)throw {msg:'这不是有效的备份码'};return o}

  const s=e.target.closest('[data-say]');if(s)return say(s.dataset.say);
  const dp=e.target.closest('[data-delpat]');if(dp){const id=dp.dataset.delpat;S.myPats=(S.myPats||[]).filter(p=>p.id!==id);delete (S.pats||{})[id];save();toast('已删除');return renderDecks()}
  const rn=e.target.closest('[data-ren]');if(rn){renaming=rn.dataset.ren;renderDecks();const i=$('#renIn');if(i){i.focus();i.select()}return}
  const rs=e.target.closest('[data-rensave]');if(rs){const dk=S.decks.find(x=>x.id===rs.dataset.rensave);const v=($('#renIn').value||'').trim();if(dk&&v){dk.name=v;save();hud();toast('已改名')}renaming=null;return renderDecks()}
  const um=e.target.closest('[data-unmaster]');if(um){const r=S.srs[um.dataset.unmaster];if(r){r.mastered=false;r.st=0;r.due=addDays(today(),1)}save();toast('明天会复习它');return renderDecks()}
  const d=e.target.closest('[data-del]');if(d){const [id,k]=[d.dataset.del.slice(0,d.dataset.del.lastIndexOf(':')),+d.dataset.del.split(':').pop()];const dk=S.decks.find(x=>x.id===id);dk.items.splice(k,1);save();return renderDecks()}
  const dd=e.target.closest('[data-deldeck]');if(dd){
    if(S.decks.length<=1)return toast('至少要保留一个词库');
    if(dd.dataset.armed){const nm=(S.decks.find(x=>x.id===dd.dataset.deldeck)||{}).name;S.decks=S.decks.filter(x=>x.id!==dd.dataset.deldeck);if(!S.decks.find(x=>x.id===S.active))S.active=S.decks[0].id;openDeck=null;
      if(S.day&&!S.day.started&&!S.day.done)buildDay(true);save();hud();toast(`「${nm}」已删除`);return renderDecks()}
    dd.dataset.armed='1';dd.textContent='确认删除？';dd.classList.add('coral');setTimeout(()=>{if(dd.isConnected){delete dd.dataset.armed;dd.textContent='✕';dd.classList.remove('coral')}},3000);return}
  const rl=e.target.closest('[data-relearn]');if(rl){const d=S.decks.find(x=>x.id===DUP);if(!d)return;const list=rl.dataset.relearn==='*'?d.items.slice():[d.items[+rl.dataset.relearn]];
    list.forEach(it=>{addToMyWords(it.en,it.zh,it.ex,it.exZh);d.items=d.items.filter(x=>x!==it)});if(!d.items.length){S.decks=S.decks.filter(x=>x.id!==DUP);if(S.active===DUP)S.active=S.decks[0].id;openDeck=null}
    save();toast(`${list.length} 个词已放进生词本重新学`);return renderDecks()}
});
$('#sndBtn').onclick=()=>{S.snd=!S.snd;save();hud();toast(S.snd?'音效已打开':'音效已关闭')};
$('#libBtn').onclick=()=>go('decks');
hud();go('today');checkBadges();
/* 放到网上时：注册离线缓存（在本地文件或 claude.ai 里会自动跳过） */
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

setInterval(()=>{if(tab==='pet')decay();if(S.day&&S.day.date!==today()&&tab==='today'&&!$('#gbody'))go('today')},60000);
</script>
